name: maymay-dev

include:
  - docker-compose.dev.yml

services:
  backend:
    build: ./studynest_be
    restart: unless-stopped
    env_file:
      - ./studynest_be/.env.development.example
      - path: ./studynest_be/.env.docker.local
        required: false
    environment:
      APP_ENV: development
      POSTGRES_USER: maymay_dev
      POSTGRES_PASSWORD: dev_only_password
      POSTGRES_DB: studynest_dev
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      DATABASE_ASYNC_URL: postgresql+asyncpg://maymay_dev:dev_only_password@postgres:5432/studynest_dev
      REDIS_URL: redis://redis:6379/0
      PISTON_URL: http://piston:2000
      MAIL_SERVER: mailpit
      MAIL_PORT: "1025"
      MAIL_TLS: "False"
      MAIL_SSL: "False"
      FRONTEND_URL: http://localhost:${MAYMAY_DEV_WEB_PORT:-3000}
      BACKEND_URL: http://localhost:${MAYMAY_DEV_API_PORT:-8000}
      PUBLIC_API_URL: http://localhost:${MAYMAY_DEV_API_PORT:-8000}
      PAYPAL_REDIRECT_URI: http://localhost:${MAYMAY_DEV_API_PORT:-8000}/api/v1/lecturer/payout/callback
      GITHUB_OAUTH_REDIRECT_URI: http://localhost:${MAYMAY_DEV_WEB_PORT:-3000}/api/agent/github/callback
      CORS_ALLOWED_ORIGINS: http://localhost:${MAYMAY_DEV_WEB_PORT:-3000}
      TUTOR_VOICE_ORIGINS: http://localhost:${MAYMAY_DEV_WEB_PORT:-3000}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        alembic upgrade head
        python scripts/seed_catalog_v2.py
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:${MAYMAY_DEV_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    volumes:
      - backend_r2_cache:/app/.cache/r2
    networks: [maymay_dev_net]

  frontend:
    build:
      context: ./studynest_fe
      args:
        NEXT_PUBLIC_URL_BACKEND: http://localhost:${MAYMAY_DEV_API_PORT:-8000}
        NEXT_PUBLIC_URL_BACKEND_WS: ws://localhost:${MAYMAY_DEV_API_PORT:-8000}
        NEXT_PUBLIC_URL_FRONTEND: http://localhost:${MAYMAY_DEV_WEB_PORT:-3000}
        NEXT_PUBLIC_AUTH_MODE: cookie
        NEXT_PUBLIC_DPOP_API_ORIGIN: http://localhost:${MAYMAY_DEV_API_PORT:-8000}
        NEXT_PUBLIC_URL_GOOGLE_LOGIN: ${NEXT_PUBLIC_URL_GOOGLE_LOGIN:-}
        NEXT_PUBLIC_PAYPAL_CLIENT_ID: ${NEXT_PUBLIC_PAYPAL_CLIENT_ID:-}
        INTERNAL_BACKEND_URL: http://backend:8000
    restart: unless-stopped
    environment:
      INTERNAL_BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_URL_BACKEND: http://localhost:${MAYMAY_DEV_API_PORT:-8000}
      NEXT_PUBLIC_URL_BACKEND_WS: ws://localhost:${MAYMAY_DEV_API_PORT:-8000}
      NEXT_PUBLIC_URL_FRONTEND: http://localhost:${MAYMAY_DEV_WEB_PORT:-3000}
      NEXT_PUBLIC_AUTH_MODE: cookie
    ports:
      - "127.0.0.1:${MAYMAY_DEV_WEB_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks: [maymay_dev_net]

  piston-runtimes:
    image: python:3.11-slim
    restart: "on-failure:3"
    command: ["python", "-u", "/install_piston_runtimes.py", "--base-url", "http://piston:2000"]
    depends_on:
      piston:
        condition: service_healthy
    volumes:
      - ./studynest_be/scripts/install_piston_runtimes.py:/install_piston_runtimes.py:ro
    networks: [maymay_dev_net]

volumes:
  backend_r2_cache:
